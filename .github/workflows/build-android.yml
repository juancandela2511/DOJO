name: Compilar APK Android (Kung Fu Dojo)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias y sincronizar Capacitor
        working-directory: ./frontend-vue
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Compilar APK con Gradle
        working-directory: ./frontend-vue/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: KungFuDojo-Android-APK
          path: frontend-vue/android/app/build/outputs/apk/debug/app-debug.apk
